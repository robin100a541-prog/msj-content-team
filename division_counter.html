<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Division Counter Graphic</title>
<style>
  @font-face {
    font-family: 'Bebas';
    src: local('Bebas Neue');
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    background: transparent;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    left: 0; top: 0;
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 90px;
  }
  #card {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 26px;
    opacity: 0;
    transform: translateY(-22px);
    padding: 22px 46px;
  }
  /* subtle premium baseline rule under the whole graphic */
  #baseline {
    position: absolute;
    left: 50%;
    bottom: -6px;
    height: 3px;
    width: 0%;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    box-shadow: 0 0 18px rgba(255,255,255,0.7);
  }
  .label {
    font-family: 'Bebas Neue','Arial Narrow',sans-serif;
    font-weight: 700;
    font-size: 54px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.92);
    text-shadow:
      0 2px 10px rgba(0,0,0,0.55),
      0 0 26px rgba(255,255,255,0.18);
    white-space: nowrap;
  }
  .label .accent {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffffff;
    margin-right: 16px;
    box-shadow: 0 0 12px 2px rgba(255,255,255,0.9);
    vertical-align: middle;
  }
  #numberWindow {
    position: relative;
    height: 110px;
    width: 130px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, black 18%, black 82%, transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0%, black 18%, black 82%, transparent 100%);
  }
  #reel {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    will-change: transform;
  }
  .digit {
    height: 110px;
    line-height: 110px;
    font-family: 'Bebas Neue','Arial Narrow',sans-serif;
    font-weight: 700;
    font-size: 96px;
    color: #ffffff;
    text-align: center;
    text-shadow:
      0 4px 18px rgba(0,0,0,0.6),
      0 0 34px rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div class="label"><span class="accent"></span>DIVISION</div>
    <div id="numberWindow">
      <div id="reel"></div>
    </div>
    <div id="baseline"></div>
  </div>
</div>

<script>
/* ───────────────────────────────────────────────────────────────
   SEQUENCE CONFIG — edit this array to change the called numbers
   and timing (ms) to sync with speech.
   ─────────────────────────────────────────────────────────────── */
const SEQUENCE = [7, 8, 6, 5];
const INTRO_DELAY   = 400;   // ms before card fades in
const FIRST_NUMBER_DELAY = 250; // ms after intro before first number settles
const STEP_INTERVAL = 900;   // ms between each subsequent number change
const SPIN_DURATION = 300;   // ms — scroll speed per change (0.2-0.35s range)

const DIGIT_H = 110;
const reel = document.getElementById('reel');
const card = document.getElementById('card');
const baseline = document.getElementById('baseline');

// Build the reel: render every value in sequence stacked vertically,
// so we can simply translateY to "scroll" between them like a slot wheel.
SEQUENCE.forEach(val => {
  const d = document.createElement('div');
  d.className = 'digit';
  d.textContent = val;
  reel.appendChild(d);
});

function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutExpo(t) {
  return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
}

function animateReelTo(index, duration, withBounce) {
  return new Promise(resolve => {
    const startY = parseFloat(reel.style.getPropertyValue('--y') || 0);
    const targetY = -index * DIGIT_H;
    const startTime = performance.now();

    function frame(now) {
      const t = Math.min((now - startTime) / duration, 1);
      const eased = withBounce ? easeOutBack(t) : easeOutExpo(t);
      const y = startY + (targetY - startY) * eased;
      reel.style.transform = `translateY(${y}px)`;
      reel.style.setProperty('--y', y);
      if (t < 1) requestAnimationFrame(frame);
      else { reel.style.setProperty('--y', targetY); resolve(); }
    }
    requestAnimationFrame(frame);
  });
}

async function run() {
  // Pre-position reel at first number, hidden
  reel.style.transform = `translateY(0px)`;
  reel.style.setProperty('--y', 0);

  await wait(INTRO_DELAY);

  // Fade + rise in the whole card
  card.style.transition = 'opacity 0.55s cubic-bezier(0.16,1,0.3,1), transform 0.55s cubic-bezier(0.16,1,0.3,1)';
  card.style.opacity = '1';
  card.style.transform = 'translateY(0px)';

  baseline.style.transition = 'width 0.7s cubic-bezier(0.16,1,0.3,1)';
  baseline.style.width = '92%';

  await wait(FIRST_NUMBER_DELAY);

  // Settle on first number with gentle bounce
  await animateReelTo(0, 420, true);

  // Step through the rest of the sequence
  for (let i = 1; i < SEQUENCE.length; i++) {
    await wait(STEP_INTERVAL - SPIN_DURATION);
    const isLast = i === SEQUENCE.length - 1;
    await animateReelTo(i, isLast ? 380 : SPIN_DURATION, isLast);
  }
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

window.addEventListener('load', run);
</script>
</body>
</html>
