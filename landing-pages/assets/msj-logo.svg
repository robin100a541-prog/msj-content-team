<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="msj-disc">
      <circle cx="100" cy="100" r="78"/>
    </clipPath>
    <linearGradient id="msj-mtn-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4C430"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- broken navy ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#1B2A6B" stroke-width="11"
    stroke-linecap="round" stroke-dasharray="255 20 260 20" stroke-dashoffset="-40"/>

  <!-- gold disc -->
  <circle cx="100" cy="100" r="78" fill="#F5C518"/>

  <g clip-path="url(#msj-disc)">
    <!-- sun -->
    <circle cx="118" cy="72" r="26" fill="#F2960F"/>

    <!-- back mountain range -->
    <polygon points="18,168 60,96 88,132 112,84 132,116 152,90 182,168" fill="url(#msj-mtn-back)"/>

    <!-- front mountain range (lighter, catches the "light") -->
    <polygon points="10,170 55,108 78,138 100,78 120,124 145,100 170,140 190,170" fill="#FCE38A"/>
    <polygon points="100,78 108,94 92,110 100,78" fill="#FFF3C4"/>

    <!-- player silhouette -->
    <g fill="#0B0D12">
      <circle cx="100" cy="100" r="7.5"/>
      <path d="M89 110c3-4 8-6 11-6s8 2 11 6c5 6 7 15 6 26l-2 22c-.3 3-2 5-5 5l-1-16-1 16h-16l-1-16-1 16c-3 0-4.7-2-5-5l-2-22c-1-11 1-20 6-26z"/>
      <path d="M79 116c-3 3-5 8-5 13l1 9c.2 2 2 3 4 2l3-1-1-14c0-4 1-7 3-10z"/>
      <circle cx="72" cy="132" r="7" fill="#0B0D12"/>
    </g>
  </g>

  <!-- disc rim highlight -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
</svg>
